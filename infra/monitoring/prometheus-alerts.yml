groups:
  - name: depanni_latency
    rules:
      - alert: DepanniHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_ms_bucket[5m])) by (le)
          ) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DEPANNI API p95 > 500ms"
          description: "Latence p95 HTTP dépassée sur 5 minutes."
